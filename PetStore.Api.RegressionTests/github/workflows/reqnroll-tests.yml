name: Run Reqnroll Tests and Generate Allure Report

on:
  push:
    branches:
      - main   # or your default branch (e.g., 'develop')
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest  # Use ubuntu, or switch to 'windows-latest' if using Windows runners

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'  # Adjust to match your .NET version

      - name: Restore dependencies
        run: dotnet restore

      - name: Build project
        run: dotnet build --no-restore --configuration Release

      - name: Run Reqnroll Tests
        run: dotnet test --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Install Allure CLI
        run: npm install -g allure-commandline

      - name: Generate Allure Report
        run: allure generate allure-results --clean -o allure-report

      - name: Upload Allure Report as an artifact
        uses: actions/upload-artifact@v3
        with:
          name: allure-report
          path: allure-report